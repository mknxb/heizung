<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heizung · ETA SH</title>
<style>
:root{--bg:#131312;--surface:#1b1b19;--surface2:#232320;--border:#312f2b;--t1:#f2f1ee;--t2:#c2c1b6;--t3:#86857c;
--kessel:#eb6834;--ruecklauf:#3987e5;--abgas:#e66767;--o2:#1baf7a;--mischer:#b48ee8;--pellet:#eda100;--solar:#1baf7a;--blau:#3987e5;--rot:#e66767;--r:14px}
:root[data-theme="light"]{--bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--border:#e3e1d9;--t1:#17160f;--t2:#50504c;--t3:#8a8980;
--kessel:#d95926;--ruecklauf:#2a78d6;--abgas:#db4b4b;--o2:#199e70;--mischer:#8a5fd0;--pellet:#c98500;--solar:#199e70;--blau:#2a78d6;--rot:#db4b4b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:24px 16px 64px}
.wrap{max-width:1160px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:4px}
h1{font-size:23px;font-weight:650;letter-spacing:-.01em}.sub{color:var(--t3);font-size:13px;margin-top:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--o2);margin-right:5px;vertical-align:middle}
.toggle{background:var(--surface);border:1px solid var(--border);color:var(--t2);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
section{margin-top:26px}
.sec-h{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:12px;font-weight:600}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1.1fr 1fr 1fr}
.kpis{grid-template-columns:repeat(auto-fit,minmax(125px,1fr))}
@media(max-width:860px){.g3{grid-template-columns:1fr 1fr}}@media(max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.ct{font-size:14px;font-weight:600;margin-bottom:2px}.cs{font-size:12px;color:var(--t3);margin-bottom:13px}
.kpi .v{font-size:23px;font-weight:650;letter-spacing:-.02em;line-height:1.1}.kpi .v small{font-size:13px;color:var(--t3);margin-left:3px}
.kpi .l{color:var(--t2);font-size:12.5px;margin-top:5px}.accent{height:3px;width:26px;border-radius:2px;margin-bottom:10px}
.strat{display:flex;flex-direction:column;gap:4px}.layer{display:flex;align-items:center;gap:10px}
.ln{width:96px;font-size:12px;color:var(--t2)}.lt{width:50px;text-align:right;font-weight:600;font-size:13px}.lbar{flex:1;height:17px;border-radius:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:12px}
.tile .tv{font-size:18px;font-weight:650;line-height:1.1}.tile .tl{font-size:11.5px;color:var(--t3);margin-top:3px}
svg{display:block;width:100%;overflow:visible}.lbl{fill:var(--t3);font-size:10.5px}.gridline{stroke:var(--border);stroke-dasharray:2 3;opacity:.55}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--t2)}
.legend span{display:inline-flex;align-items:center;gap:6px}.sw{width:11px;height:3px;border-radius:2px;display:inline-block}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--t2);font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}.seg button.on{background:var(--blau);color:#fff}
.row2{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--border)}
th{color:var(--t3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}th:first-child,td:first-child{text-align:left}
td.hl{color:var(--kessel);font-weight:600}
.tt{position:fixed;pointer-events:none;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--t1);box-shadow:0 6px 24px rgba(0,0,0,.35);opacity:0;transition:opacity .08s;z-index:10;white-space:nowrap}
.src{color:var(--t3);font-size:11px;margin-top:10px}.foot{color:var(--t3);font-size:12px;margin-top:38px;border-top:1px solid var(--border);padding-top:16px}
.err{background:var(--surface);border:1px solid var(--rot);border-radius:var(--r);padding:16px;color:var(--t2)}
@keyframes flow{to{stroke-dashoffset:-32}}
.flow{stroke-dasharray:7 7;animation:flow 1.1s linear infinite}
@keyframes flick{0%,100%{transform:scaleY(.92);opacity:.85}50%{transform:scaleY(1.12);opacity:1}}
.flame{transform-box:fill-box;transform-origin:center bottom;animation:flick .9s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
@keyframes pump{to{transform:rotate(360deg)}}
.pumpon{transform-box:fill-box;transform-origin:center;animation:pump 2.2s linear infinite}
.schema .comp:hover{filter:brightness(1.15);cursor:default}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--t2);margin-left:8px}
</style></head>
<body><div class="wrap">
<header><div><h1>Heizung · ETA SH</h1><div class="sub" id="period">lädt …</div></div>
<button class="toggle" id="themeBtn">☀︎ Hell</button></header>
<div id="app"></div>
<div class="foot" id="foot"></div>
</div><div class="tt" id="tt"></div>
<script>
const DATA_URL="./data/eta_dashboard.json";
const tt=document.getElementById('tt');
const de=n=>(n==null||n===''?'–':(typeof n==='number'?(Math.abs(n)>=100?Math.round(n).toLocaleString('de-DE'):n.toLocaleString('de-DE',{maximumFractionDigits:1})):n));
function showTT(e,h){tt.innerHTML=h;tt.style.opacity=1;let x=e.clientX+14,y=e.clientY+14;if(x+tt.offsetWidth>innerWidth)x=e.clientX-tt.offsetWidth-14;if(y+tt.offsetHeight>innerHeight)y=e.clientY-tt.offsetHeight-14;tt.style.left=x+'px';tt.style.top=y+'px';}
function hideTT(){tt.style.opacity=0;}
let D=null,gran='tag',metric='aktiv_h',burnIdx=null;
const LVL={alarm:['--rot','⚠'],warn:['--pellet','!'],info:['--blau','i']};

function axis(el,H,m,lo,hi,fmt){let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo||1));g+=`<line class="gridline" x1="${m.l}" x2="W" y1="${y}" y2="${y}"/><text class="lbl" x="${m.l-6}" y="${y+3}" text-anchor="end">${fmt?fmt(v):Math.round(v)}</text>`;}return g;}

function multiLine(el,rows,lines,{fmt,unit,xkey}){
 const W=el.clientWidth||520,H=230,m={t:10,r:14,b:24,l:40};
 const xs=rows.map((r,i)=>i);
 let vals=[];lines.forEach(L=>rows.forEach(r=>{if(r[L.key]!=null)vals.push(r[L.key]);}));
 if(!vals.length){el.innerHTML='<div class="src">keine Daten</div>';return;}
 const lo=Math.min(...vals),hi=Math.max(...vals),pad=(hi-lo)*0.1||1,LO=lo-pad,HI=hi+pad;
 const X=i=>m.l+(W-m.l-m.r)*(i/(rows.length-1||1)),Y=v=>m.t+(H-m.t-m.b)*(1-(v-LO)/(HI-LO||1));
 let g=axis(el,H,m,LO,HI,fmt).replaceAll('x2="W"',`x2="${W-m.r}"`);
 const step=Math.max(1,Math.ceil(rows.length/7));
 for(let i=0;i<rows.length;i+=step)g+=`<text class="lbl" x="${X(i)}" y="${H-6}" text-anchor="middle">${rows[i][xkey]}</text>`;
 lines.forEach(L=>{let d='',pen=false;rows.forEach((r,i)=>{if(r[L.key]==null){pen=false;return;}d+=(pen?'L':'M')+X(i)+' '+Y(r[L.key])+' ';pen=true;});g+=`<path d="${d}" fill="none" stroke="var(${L.color})" stroke-width="2"/>`;});
 // Crosshair-Hitzonen
 g+=`<rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent" id="hit"/>`;
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
 const svg=el.querySelector('svg');
 svg.addEventListener('mousemove',e=>{const rc=svg.getBoundingClientRect();const px=(e.clientX-rc.left)/rc.width*W;let i=Math.round((px-m.l)/((W-m.l-m.r)/(rows.length-1||1)));i=Math.max(0,Math.min(rows.length-1,i));const r=rows[i];
   let h=`<b>${r[xkey]}</b>`;lines.forEach(L=>{if(r[L.key]!=null)h+=`<br><span class="sw" style="background:var(${L.color})"></span> ${L.name}: ${de(r[L.key])}${unit||''}`;});showTT(e,h);});
 svg.addEventListener('mouseleave',hideTT);
 el.insertAdjacentHTML('afterend','');
 return `<div class="legend">${lines.map(L=>`<span><span class="sw" style="background:var(${L.color})"></span>${L.name}</span>`).join('')}</div>`;
}
function barLine(el,pts,{yl,color,fmt,unit,bar}){
 const W=el.clientWidth||520,H=200,m={t:10,r:12,b:24,l:40};
 const ys=pts.map(p=>p.y==null?0:p.y),lo=Math.min(...ys,0),hi=Math.max(...ys,1)+(Math.max(...ys,1))*0.1;
 const X=i=>m.l+(W-m.l-m.r)*(i/(pts.length-1||1)),Y=v=>m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo||1));
 let g=axis(el,H,m,lo,hi,fmt).replaceAll('x2="W"',`x2="${W-m.r}"`);
 const step=Math.max(1,Math.ceil(pts.length/7));
 if(bar){const bw=(W-m.l-m.r)/pts.length;pts.forEach((p,i)=>{if(p.y){g+=`<rect x="${m.l+(W-m.l-m.r)*(i/pts.length)+bw*0.15}" y="${Y(p.y)}" width="${bw*0.7}" height="${Math.max((H-m.t-m.b)-(Y(p.y)-m.t),0)}" rx="2" fill="var(${color})"/>`;}g+=`<rect x="${m.l+(W-m.l-m.r)*(i/pts.length)}" y="${m.t}" width="${bw}" height="${H-m.t-m.b}" fill="transparent" data-i="${i}"/>`;if(i%step===0)g+=`<text class="lbl" x="${m.l+(W-m.l-m.r)*(i/pts.length)+bw/2}" y="${H-6}" text-anchor="middle">${p.x}</text>`;});}
 else{let d='';pts.forEach((p,i)=>d+=(i?'L':'M')+X(i)+' '+Y(p.y==null?lo:p.y)+' ');g+=`<path d="${d}" fill="none" stroke="var(${color})" stroke-width="2"/>`;pts.forEach((p,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(p.y==null?lo:p.y)}" r="7" fill="transparent" data-i="${i}"/><circle cx="${X(i)}" cy="${Y(p.y==null?lo:p.y)}" r="2.3" fill="var(${color})"/>`;for(let j=0;j<pts.length;j+=step);});for(let i=0;i<pts.length;i+=step)g+=`<text class="lbl" x="${X(i)}" y="${H-6}" text-anchor="middle">${pts[i].x}</text>`;}
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
 el.querySelectorAll('[data-i]').forEach(c=>{const p=pts[+c.dataset.i];c.addEventListener('mousemove',e=>showTT(e,`<b>${p.full||p.x}</b><br>${yl}: ${de(p.y)} ${unit||''}`));c.addEventListener('mouseleave',hideTT);});
}

function scatterChart(el,groups,{line,fmtx,fmty,ux,uy}){
 const W=el.clientWidth||520,H=230,m={t:10,r:14,b:30,l:40};
 let allx=[],ally=[];groups.forEach(G=>G.pts.forEach(p=>{allx.push(p.x);ally.push(p.y);}));
 if(line){allx.push(line.x1,line.x2);ally.push(line.y1,line.y2);}
 if(!allx.length){el.innerHTML='<div class="src">noch keine Betriebspunkte – füllt sich im Betrieb</div>';return '';}
 const xlo=Math.min(...allx),xhi=Math.max(...allx),ylo=Math.min(...ally,0),yhi=Math.max(...ally);
 const XL=xlo-1,XH=xhi+1,YL=ylo,YH=yhi+(yhi-ylo)*0.1||1;
 const X=v=>m.l+(W-m.l-m.r)*((v-XL)/(XH-XL||1)),Y=v=>m.t+(H-m.t-m.b)*(1-(v-YL)/(YH-YL||1));
 let g='';for(let i=0;i<=4;i++){const v=YL+(YH-YL)*i/4,y=Y(v);g+=`<line class="gridline" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text class="lbl" x="${m.l-6}" y="${y+3}" text-anchor="end">${fmty?fmty(v):Math.round(v)}</text>`;}
 for(let i=0;i<=5;i++){const v=XL+(XH-XL)*i/5;g+=`<text class="lbl" x="${X(v)}" y="${H-8}" text-anchor="middle">${fmtx?fmtx(v):Math.round(v)}</text>`;}
 if(line)g+=`<line x1="${X(line.x1)}" y1="${Y(line.y1)}" x2="${X(line.x2)}" y2="${Y(line.y2)}" stroke="var(--t3)" stroke-width="2" stroke-dasharray="5 4"/>`;
 groups.forEach(G=>G.pts.forEach(p=>{g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="var(${G.color})" fill-opacity="0.65" data-x="${p.x}" data-y="${p.y}" data-n="${G.name}"/>`;}));
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
 el.querySelectorAll('circle[data-x]').forEach(c=>{c.addEventListener('mousemove',e=>showTT(e,`<b>${c.dataset.n}</b><br>Außen ${c.dataset.x}${ux||''} · Vorlauf ${c.dataset.y}${uy||''}`));c.addEventListener('mouseleave',hideTT);});
 const leg=groups.map(G=>`<span><span class="sw" style="background:var(${G.color})"></span>${G.name}</span>`).join('')+(line?`<span><span class="sw" style="background:var(--t3)"></span>${line.name}</span>`:'');
 return `<div class="legend">${leg}</div>`;
}
function tiles(items){return `<div class="tiles">${items.map(t=>`<div class="tile"><div class="tv"${t.c?` style="color:var(${t.c})"`:''}>${t.v}</div><div class="tl">${t.l}</div></div>`).join('')}</div>`;}
function tcol(t){if(t==null)return '#555';const c0=[57,135,229],c1=[235,104,52];const x=Math.max(0,Math.min(1,(t-22)/(75-22)));return `rgb(${c0.map((a,i)=>Math.round(a+(c1[i]-a)*x)).join(',')})`;}
function plen(d){const n=d.match(/-?\d+(?:\.\d+)?/g).map(Number);let s=0;for(let i=2;i<n.length;i+=2)s+=Math.hypot(n[i]-n[i-2],n[i+1]-n[i-1]);return s;}
function chev(d,hot){const len=plen(d),k=Math.max(1,Math.round(len/36)),dur=len/40;let o='';
 for(let i=0;i<k;i++)o+=`<polygon points="-5.5,-4.8 4.8,0 -5.5,4.8 -2,0" fill="${hot?'#ffe6cf':'#e2f1ff'}"><animateMotion dur="${dur.toFixed(2)}s" begin="${(-dur*i/k).toFixed(2)}s" repeatCount="indefinite" rotate="auto" path="${d}"/></polygon>`;
 return o;}
function pipe(d,hot,on){const lc='fill="none" stroke-linecap="round" stroke-linejoin="round"';
 return `<path d="${d}" ${lc} stroke="#0c0c0d" stroke-width="13"/>${on?`<path d="${d}" ${lc} stroke="${hot?'#ff6a2a':'#4aa3ff'}" stroke-width="19" opacity=".2"/>`:''}<path d="${d}" ${lc} stroke="${on?(hot?'#ff7a35':'#58acff'):(hot?'#6b5547':'#4d5a68')}" stroke-width="4.5"/>${on?chev(d,hot):''}`;}
function ptcol(t){const S=[[25,[36,100,255]],[40,[64,140,255]],[52,[170,110,150]],[62,[255,140,60]],[72,[255,100,30]],[88,[255,55,15]]];
 if(t<=S[0][0])return 'rgb('+S[0][1]+')';
 for(let i=1;i<S.length;i++){if(t<=S[i][0]){const a=S[i-1],b=S[i],k=(t-a[0])/(b[0]-a[0]);return 'rgb('+[0,1,2].map(j=>Math.round(a[1][j]+(b[1][j]-a[1][j])*k)).join(',')+')';}}
 return 'rgb('+S[S.length-1][1]+')';}
function isStale(L){const t=Date.parse((L.ts||'').replace(' ','T'));return !t||(Date.now()-t)>90*60000;}
function tsTxt(L){const m=/(\d{4})-(\d\d)-(\d\d)[ T](\d\d:\d\d)/.exec(L.ts||'');return m?m[3]+'.'+m[2]+'. '+m[4]:'unbekannt';}
function schema(L){
 const old=isStale(L);
 const brennt=!old&&(L.geblaese||0)>500,pelB=brennt&&(L.pel_einschub||0)>1;
 const P=(L.puffer||[]).slice();
 const solarOn=!old&&!!((L.solar_pumpe&&/ein|an|^1/i.test(''+L.solar_pumpe))||(L.kollektor!=null&&P[4]!=null&&L.kollektor>P[4]+4));
 const hkOn=!old&&(L.hk_vorlauf||0)>25,fbOn=!old&&(L.fb_vorlauf||0)>25;
 const kOn=!old&&!!((L.kesselpumpe&&/ein|an|^1/i.test(''+L.kesselpumpe))||brennt);
 const holzOn=kOn&&!pelB,pelOn=kOn&&pelB,wwOn=!old&&(L.ww_aus||0)>35;
 const YS=[146,180,214,248,282];
 let last=20;const T=[0,1,2,3,4].map(i=>{if(P[i]!=null)last=P[i];return last;});
 const stops=`<stop offset="0" stop-color="${ptcol(T[0])}"/>`+T.map((t,i)=>`<stop offset="${((YS[i]-101)/334).toFixed(3)}" stop-color="${ptcol(t)}"/>`).join('')+`<stop offset="1" stop-color="${ptcol(T[4])}"/>`;
 const sens=YS.map((y,i)=>`<line x1="552" y1="${y}" x2="592" y2="${y}" stroke="#d6d5ce" stroke-width="1.2"/><circle cx="552" cy="${y}" r="3.5" fill="#0b0b0c" stroke="#e8e7e1"/><rect x="592" y="${y-14}" width="54" height="28" rx="5" fill="#0b0b0c" stroke="#5a5d62"/><text x="619" y="${y+6}" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">${P[i]==null?'–':Math.round(P[i])+'°'}</text>`).join('');
 const imp=(on)=>`<g class="${on?'pumpon':''}"><path d="M-8 0H8M0 -8V8" stroke="#d0d3d8" stroke-width="3" stroke-linecap="round"/></g>`;
 const pumpSym=(cx,cy,on,tt)=>`<g class="comp" data-tt="${tt}" transform="translate(${cx},${cy})"><circle r="13" fill="#2b2d30" stroke="${on?'#eb6834':'#9a9da2'}" stroke-width="2"/>${imp(on)}<circle r="3" fill="#111"/></g>`;
 const mischSym=(cx,cy,on,tt)=>`<g class="comp" data-tt="${tt}" transform="translate(${cx},${cy})"><circle r="13" fill="#2b2d30" stroke="${on?'#b48ee8':'#9a9da2'}" stroke-width="2"/><path d="M0 -7 L0 0 L6 5" fill="none" stroke="${on?'#b48ee8':'#9a9da2'}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>`;
 const rays=[0,1,2,3,4,5,6,7].map(i=>`<line x1="0" y1="-14" x2="0" y2="-20" stroke="#f5c842" stroke-width="2" stroke-linecap="round" transform="rotate(${i*45})"/>`).join('');
 const fireOn=brennt&&!pelB;
 const smoke=brennt?`<g class="flame" opacity=".5"><circle cx="289" cy="86" r="5" fill="#9a9a9a"/><circle cx="294" cy="78" r="4" fill="#9a9a9a" opacity=".7"/><circle cx="288" cy="72" r="3" fill="#9a9a9a" opacity=".5"/></g>`:'';
 return `<svg viewBox="30 0 890 516" class="schema">
 <defs>
  <linearGradient id="sWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3c40"/><stop offset="1" stop-color="#1c1d1f"/></linearGradient>
  <radialGradient id="sSpot" cx="50%" cy="38%" r="62%"><stop offset="0" stop-color="#6a6d73" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="sFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2b2d"/><stop offset="1" stop-color="#121213"/></linearGradient>
  <linearGradient id="sGray" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9dcdf"/><stop offset=".55" stop-color="#a9adb1"/><stop offset="1" stop-color="#80858a"/></linearGradient>
  <linearGradient id="sYellow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd940"/><stop offset=".55" stop-color="#f5b400"/><stop offset="1" stop-color="#d89400"/></linearGradient>
  <linearGradient id="sIns" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#76797e"/><stop offset=".4" stop-color="#3c3e41"/><stop offset="1" stop-color="#1b1c1e"/></linearGradient>
  <linearGradient id="sTemp" x1="0" y1="0" x2="0" y2="1">${stops}</linearGradient>

function hbars(rows,unit){const mx=Math.max(...rows.map(r=>r.v||0),1);return rows.map(r=>`<div style="display:flex;align-items:center;gap:12px;margin:9px 0"><div style="width:110px;font-size:13px;color:var(--t2);flex-shrink:0">${r.n}</div><div style="flex:1;background:var(--surface2);border-radius:6px;height:26px;overflow:hidden"><div style="height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:12px;font-weight:600;color:#fff;min-width:46px;width:${Math.max((r.v||0)/mx*100,6)}%;background:var(${r.c})">${de(r.v)} ${unit}</div></div></div>`).join('');}

  <div class="card">
   <div class="tiles" style="margin-bottom:12px">${[['Übertemperatur',de(INC.uebertemp),'--rot'],['STB-Auslösung',de(INC.stb),'--rot']].map(k=>`<div class="tile"><div class="tv" style="color:var(${k[2]})">${k[1]}</div><div class="tl">${k[0]}</div></div>`).join('')}</div>
   ${(INC.events&&INC.events.length)?`<table><thead><tr><th>Start</th><th>Kessel max °</th><th>Hinweis</th></tr></thead><tbody>${INC.events.slice().reverse().map(e=>`<tr><td>${e.start}</td><td style="color:var(--rot);font-weight:600">${de(e.kessel_max)}</td><td>${e.note}</td></tr>`).join('')}</tbody></table>`:'<div class="src">Keine kritischen Abbrände erkannt.</div>'}
   <div class="src">Erkannt werden Abbrände mit Kessel &gt; 88 °C. Der Fall vom 15.11. (94,1 °C nach Stromausfall) ist hier gelistet. STB = harte Sicherheitsabschaltung, 0 = nie ausgelöst.</div></div></section>`;

 const pb=D.pellet_burn;
 if(pb){html+=`
 <section><div class="sec-h">Letzter Pellet-Abbrand <span class="badge">Start ${pb.start} · ${de(pb.dauer_h)} h</span></div>
  <div class="card" style="margin-bottom:14px">${tiles([{v:de(pb.abgas_max)+'°',l:'Abgas max',c:'--abgas'},{v:de(pb.o2_mean)+'%',l:'O₂ Ø',c:'--o2'},{v:de(pb.puffer_vor)+'→'+de(pb.puffer_nach)+'°',l:'Puffer Ø'}])}</div>
  <div class="grid g2">
   <div class="card"><div class="ct">Temperaturverlauf</div><div class="cs">Pelletkessel, Rücklauf, Abgas</div><div id="pbTemp"></div><div id="pbTempLeg"></div></div>
   <div class="card"><div class="ct">Einschub &amp; Luftschieber</div><div class="cs">Pellet-Förderung und Luft (%)</div><div id="pbStk"></div><div id="pbStkLeg"></div></div>
  </div></section>`;}

 const cv=D.curve||{};
 html+=`
 <section><div class="sec-h">Heizkurve &amp; Betriebspunkte</div>
  <div class="grid g2">
   <div class="card"><div class="ct">Heizkörper (HK)</div><div class="cs">Vorlauf gegen Außentemperatur · gestrichelt = eingestellte Kurve</div><div id="curveHK"></div><div id="curveHKLeg"></div></div>
   <div class="card"><div class="ct">Fußboden (FB)</div><div class="cs">Vorlauf gegen Außentemperatur</div><div id="curveFB"></div><div id="curveFBLeg"></div></div>
  </div></section>

 <section><div class="sec-h">Heizkreise · Vorlauf je Tag</div>
  <div class="card"><div class="ct">Vorlauftemperatur HK &amp; FB</div><div class="cs">Tagesmittel</div><div id="hkFlow"></div><div id="hkFlowLeg"></div></div></section>

 <section><div class="sec-h">Solar</div>
  <div class="grid g2">
   <div class="card"><div class="ct">Solarertrag je Tag</div><div class="cs">kWh · füllt sich ab Logger-Start</div><div id="solarDaily"></div></div>
   <div class="card"><div class="ct">Solar live</div><div class="cs">aktueller Zustand</div>${tiles([{v:de(L.kollektor)+'°',l:'Kollektor',c:'--solar'},{v:de(L.solar_heute)+' kWh',l:'heute'},{v:de(L.solar_gestern)+' kWh',l:'gestern'},{v:de((D.energy||{}).solar_total)+' kWh',l:'gesamt (Zähler)'}])}</div>
  </div></section>

 <section><div class="sec-h">Wetter</div>
  <div class="card"><div class="ct">Außentemperatur · Tagesspanne</div><div class="cs">Min und Max je Tag</div><div id="wetter"></div><div id="wetterLeg"></div></div></section>`;

 html+=`
 <section><div class="sec-h">Zeitverlauf</div><div class="card">
   <div class="row2"><div class="seg" id="granSeg"></div><div class="seg" id="metSeg"></div></div>
   <div class="ct" id="tsTitle"></div><div class="cs" id="tsSub"></div><div id="tsChart"></div>
 </div></section>`;
 document.getElementById('app').innerHTML=html;
 document.querySelectorAll('[data-tt]').forEach(c=>{c.addEventListener('mousemove',e=>showTT(e,c.getAttribute('data-tt')));c.addEventListener('mouseleave',hideTT);});

 if(cb){const leg1=multiLine(document.getElementById('lbTemp'),cb.series,[{key:'kessel',name:'Kessel',color:'--kessel'},{key:'ruecklauf',name:'Rücklauf',color:'--ruecklauf'},{key:'abgas',name:'Abgas',color:'--abgas'}],{fmt:v=>Math.round(v)+'°',unit:'°',xkey:'t'});document.getElementById('lbTempLeg').innerHTML=leg1||'';
   const hasM=cb.series.some(r=>r.mischer!=null);const lines2=[{key:'o2',name:'O₂ %',color:'--o2'}];if(hasM)lines2.push({key:'mischer',name:'Mischer %',color:'--mischer'});
   const leg2=multiLine(document.getElementById('lbO2'),cb.series,lines2,{fmt:v=>Math.round(v),unit:'%',xkey:'t'});document.getElementById('lbO2Leg').innerHTML=(leg2||'')+(hasM?'':'<div class="src">Mischerposition erscheint ab dem nächsten Abbrand mit Live-Logger.</div>');
   const sel=document.getElementById('burnSel');if(sel)sel.onchange=()=>{burnIdx=+sel.value;render();};
   const pv=document.getElementById('burnPrev');if(pv)pv.onclick=()=>{if(burnIdx>0){burnIdx--;render();}};
   const nx=document.getElementById('burnNext');if(nx)nx.onclick=()=>{if(burnIdx<BD.length-1){burnIdx++;render();}};}

 if(pb){const l1=multiLine(document.getElementById('pbTemp'),pb.series,[{key:'kessel',name:'Pelletkessel',color:'--kessel'},{key:'ruecklauf',name:'Rücklauf',color:'--ruecklauf'},{key:'abgas',name:'Abgas',color:'--abgas'}],{fmt:v=>Math.round(v)+'°',unit:'°',xkey:'t'});document.getElementById('pbTempLeg').innerHTML=l1||'';
   const l2=multiLine(document.getElementById('pbStk'),pb.series,[{key:'einschub',name:'Einschub',color:'--pellet'},{key:'luftschieber',name:'Luftschieber',color:'--o2'}],{fmt:v=>Math.round(v),unit:'%',xkey:'t'});document.getElementById('pbStkLeg').innerHTML=l2||'';}

 if(cv.hk){const s=cv.hk_set||{tm10:41,tp10:30};const line={x1:-10,y1:s.tm10,x2:10,y2:s.tp10,name:'eingestellte Kurve'};
   document.getElementById('curveHKLeg').innerHTML=scatterChart(document.getElementById('curveHK'),[{name:'HK Betrieb',color:'--kessel',pts:cv.hk}],{line,fmtx:v=>Math.round(v)+'°',fmty:v=>Math.round(v)+'°',ux:'°',uy:'°'})||'';
   document.getElementById('curveFBLeg').innerHTML=scatterChart(document.getElementById('curveFB'),[{name:'FB Betrieb',color:'--ruecklauf',pts:cv.fb||[]}],{fmtx:v=>Math.round(v)+'°',fmty:v=>Math.round(v)+'°',ux:'°',uy:'°'})||'';}

 const hkRows=D.daily.filter(r=>r.hk!=null||r.fb!=null).map(r=>({t:r.d.slice(5),hk:r.hk,fb:r.fb}));
 if(hkRows.length){document.getElementById('hkFlowLeg').innerHTML=multiLine(document.getElementById('hkFlow'),hkRows,[{key:'hk',name:'HK-Vorlauf',color:'--kessel'},{key:'fb',name:'FB-Vorlauf',color:'--ruecklauf'}],{fmt:v=>Math.round(v)+'°',unit:'°',xkey:'t'})||'';}
 else{document.getElementById('hkFlow').innerHTML='<div class="src">Heizkreis-Verlauf füllt sich ab Logger-Start.</div>';}

 barLine(document.getElementById('solarDaily'),D.daily.map(r=>({x:r.d.slice(5),y:r.solar_heute,full:r.d})),{yl:'Solarertrag',color:'--solar',fmt:v=>Math.round(v),unit:'kWh',bar:true});

 const wRows=D.daily.filter(r=>r.tmin!=null).map(r=>({t:r.d.slice(5),tmin:r.tmin,tmax:r.tmax}));
 if(wRows.length){document.getElementById('wetterLeg').innerHTML=multiLine(document.getElementById('wetter'),wRows,[{key:'tmax',name:'Max',color:'--kessel'},{key:'tmin',name:'Min',color:'--ruecklauf'}],{fmt:v=>Math.round(v)+'°',unit:'°',xkey:'t'})||'';}

 const at=document.getElementById('abgasTrend');
 if(at&&D.burns_recent&&D.burns_recent.length){const br=D.burns_recent;
   barLine(at,br.map(b=>({x:b.start,y:b.abgas_max})),{yl:'Abgas max',color:'--abgas',fmt:v=>Math.round(v)+'°',unit:'°'});
   barLine(document.getElementById('o2Trend'),br.map(b=>({x:b.start,y:b.o2_mean})),{yl:'O₂ Ø',color:'--o2',fmt:v=>Math.round(v)+'%',unit:'%'});}

 const GRAN=[['tag','Tag'],['woche','Woche'],['monat','Monat']];
 const MET={aktiv_h:{t:'Brennerstunden',u:'h',c:'--kessel',bar:true,fmt:v=>Math.round(v)},aussen:{t:'Außentemperatur',u:'°C',c:'--ruecklauf',bar:false,fmt:v=>Math.round(v)+'°'},solar:{t:'Solarertrag',u:'kWh',c:'--solar',bar:true,fmt:v=>Math.round(v)}};
 document.getElementById('granSeg').innerHTML=GRAN.map(([k,l])=>`<button data-g="${k}" class="${k==gran?'on':''}">${l}</button>`).join('');
 document.getElementById('metSeg').innerHTML=Object.entries(MET).map(([k,m])=>`<button data-m="${k}" class="${k==metric?'on':''}">${m.t}</button>`).join('');
 function srcData(){return gran=='tag'?D.daily.map(r=>({x:r.d.slice(5),y:metric=='solar'?r.solar_heute:r[metric],full:r.d})):gran=='woche'?D.weekly.map(r=>({x:r.x,y:r[metric],full:r.x})):D.monthly.map(r=>({x:r.x.slice(5),y:r[metric],full:r.x}));}
 function draw(){const m=MET[metric];document.getElementById('tsTitle').textContent=m.t+' · '+GRAN.find(g=>g[0]==gran)[1];document.getElementById('tsSub').textContent=({tag:'je Tag',woche:'je Kalenderwoche',monat:'je Monat'})[gran]+(metric=='solar'?' · füllt sich ab Logger-Start':'');barLine(document.getElementById('tsChart'),srcData(),{yl:m.t,color:m.c,fmt:m.fmt,unit:m.u,bar:m.bar});}
 document.querySelectorAll('#granSeg button').forEach(b=>b.onclick=()=>{gran=b.dataset.g;document.querySelectorAll('#granSeg button').forEach(x=>x.classList.toggle('on',x.dataset.g==gran));draw();});
 document.querySelectorAll('#metSeg button').forEach(b=>b.onclick=()=>{metric=b.dataset.m;document.querySelectorAll('#metSeg button').forEach(x=>x.classList.toggle('on',x.dataset.m==metric));draw();});
 draw();
 document.getElementById('foot').innerHTML='Quelle: ETA SH über lokale REST-API, gesammelt auf der NAS, veröffentlicht via GitHub Pages. JSON erzeugt '+D.generated+'. „Brennerstunden"/Abbrand-Erkennung über Abgasgebläse &gt; 500 U/min. Puffer-Energie aus den Fühlertemperaturen (±15 %). Seite aktualisiert sich alle 60 s.';
}
let started=false;
function load(){fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{D=j;render();if(!started){started=true;addEventListener('resize',render);}}).catch(()=>{if(!D){document.getElementById('period').textContent='';document.getElementById('app').innerHTML='<div class="err">Konnte <b>'+DATA_URL+'</b> nicht laden. Sobald die NAS die JSON gepusht hat, erscheinen hier die Daten.</div>';}});}
load();setInterval(load,60000);
document.getElementById('themeBtn').onclick=()=>{const t=document.documentElement.getAttribute('data-theme')=='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t);event.target.textContent=t=='dark'?'☀︎ Hell':'☾ Dunkel';render();};
</script></body></html>
