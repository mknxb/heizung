<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heizung · ETA SH</title>
<style>
:root{--bg:#131312;--surface:#1b1b19;--surface2:#232320;--border:#312f2b;--t1:#f2f1ee;--t2:#c2c1b6;--t3:#86857c;
--kessel:#eb6834;--ruecklauf:#3987e5;--abgas:#e66767;--o2:#1baf7a;--mischer:#b48ee8;--pellet:#eda100;--solar:#1baf7a;--blau:#3987e5;--rot:#e66767;--r:14px}
:root[data-theme="light"]{--bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--border:#e3e1d9;--t1:#17160f;--t2:#50504c;--t3:#8a8980;
--kessel:#d95926;--ruecklauf:#2a78d6;--abgas:#db4b4b;--o2:#199e70;--mischer:#8a5fd0;--pellet:#c98500;--solar:#199e70;--blau:#2a78d6;--rot:#db4b4b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:24px 16px 64px}
.wrap{max-width:1160px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:4px}
h1{font-size:23px;font-weight:650;letter-spacing:-.01em}.sub{color:var(--t3);font-size:13px;margin-top:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--o2);margin-right:5px;vertical-align:middle}
.toggle{background:var(--surface);border:1px solid var(--border);color:var(--t2);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
section{margin-top:26px}
.sec-h{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:12px;font-weight:600}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1.1fr 1fr 1fr}
.kpis{grid-template-columns:repeat(auto-fit,minmax(125px,1fr))}
@media(max-width:860px){.g3{grid-template-columns:1fr 1fr}}@media(max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.ct{font-size:14px;font-weight:600;margin-bottom:2px}.cs{font-size:12px;color:var(--t3);margin-bottom:13px}
.kpi .v{font-size:23px;font-weight:650;letter-spacing:-.02em;line-height:1.1}.kpi .v small{font-size:13px;color:var(--t3);margin-left:3px}
.kpi .l{color:var(--t2);font-size:12.5px;margin-top:5px}.accent{height:3px;width:26px;border-radius:2px;margin-bottom:10px}
.strat{display:flex;flex-direction:column;gap:4px}.layer{display:flex;align-items:center;gap:10px}
.ln{width:96px;font-size:12px;color:var(--t2)}.lt{width:50px;text-align:right;font-weight:600;font-size:13px}.lbar{flex:1;height:17px;border-radius:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:12px}
.tile .tv{font-size:18px;font-weight:650;line-height:1.1}.tile .tl{font-size:11.5px;color:var(--t3);margin-top:3px}
svg{display:block;width:100%;overflow:visible}.lbl{fill:var(--t3);font-size:10.5px}.gridline{stroke:var(--border);stroke-dasharray:2 3;opacity:.55}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--t2)}
.legend span{display:inline-flex;align-items:center;gap:6px}.sw{width:11px;height:3px;border-radius:2px;display:inline-block}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--t2);font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}.seg button.on{background:var(--blau);color:#fff}
.row2{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--border)}
th{color:var(--t3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}th:first-child,td:first-child{text-align:left}
td.hl{color:var(--kessel);font-weight:600}
.tt{position:fixed;pointer-events:none;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--t1);box-shadow:0 6px 24px rgba(0,0,0,.35);opacity:0;transition:opacity .08s;z-index:10;white-space:nowrap}
.src{color:var(--t3);font-size:11px;margin-top:10px}.foot{color:var(--t3);font-size:12px;margin-top:38px;border-top:1px solid var(--border);padding-top:16px}
.err{background:var(--surface);border:1px solid var(--rot);border-radius:var(--r);padding:16px;color:var(--t2)}
@keyframes flow{to{stroke-dashoffset:-32}}
.flow{stroke-dasharray:7 7;animation:flow 1.1s linear infinite}
@keyframes flick{0%,100%{transform:scaleY(.92);opacity:.85}50%{transform:scaleY(1.12);opacity:1}}
.flame{transform-box:fill-box;transform-origin:center bottom;animation:flick .9s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
@keyframes pump{to{transform:rotate(360deg)}}
.pumpon{transform-box:fill-box;transform-origin:center;animation:pump 2.2s linear infinite}
.schema text{font-size:12px;fill:var(--t2)}.schema .big{font-size:15px;font-weight:650;fill:var(--t1)}.schema .comp:hover{filter:brightness(1.15);cursor:default}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--t2);margin-left:8px}
</style></head>
<body><div class="wrap">
<header><div><h1>Heizung · ETA SH</h1><div class="sub" id="period">lädt …</div></div>
<button class="toggle" id="themeBtn">☀︎ Hell</button></header>
<div id="app"></div>
<div class="foot" id="foot"></div>
</div><div class="tt" id="tt"></div>
<script>
const DATA_URL="./data/eta_dashboard.json";
const tt=document.getElementById('tt');
const de=n=>(n==null||n===''?'–':(typeof n==='number'?(Math.abs(n)>=100?Math.round(n).toLocaleString('de-DE'):n.toLocaleString('de-DE',{maximumFractionDigits:1})):n));
function showTT(e,h){tt.innerHTML=h;tt.style.opacity=1;let x=e.clientX+14,y=e.clientY+14;if(x+tt.offsetWidth>innerWidth)x=e.clientX-tt.offsetWidth-14;if(y+tt.offsetHeight>innerHeight)y=e.clientY-tt.offsetHeight-14;tt.style.left=x+'px';tt.style.top=y+'px';}
function hideTT(){tt.style.opacity=0;}
let D=null,gran='tag',metric='aktiv_h',burnIdx=null;
const LVL={alarm:['--rot','⚠'],warn:['--pellet','!'],info:['--blau','i']};

function axis(el,H,m,lo,hi,fmt){let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo||1));g+=`<line class="gridline" x1="${m.l}" x2="W" y1="${y}" y2="${y}"/><text class="lbl" x="${m.l-6}" y="${y+3}" text-anchor="end">${fmt?fmt(v):Math.round(v)}</text>`;}return g;}

function multiLine(el,rows,lines,{fmt,unit,xkey}){
 const W=el.clientWidth||520,H=230,m={t:10,r:14,b:24,l:40};
 const xs=rows.map((r,i)=>i);
 let vals=[];lines.forEach(L=>rows.forEach(r=>{if(r[L.key]!=null)vals.push(r[L.key]);}));
 if(!vals.length){el.innerHTML='<div class="src">keine Daten</div>';return;}
 const lo=Math.min(...vals),hi=Math.max(...vals),pad=(hi-lo)*0.1||1,LO=lo-pad,HI=hi+pad;
 const X=i=>m.l+(W-m.l-m.r)*(i/(rows.length-1||1)),Y=v=>m.t+(H-m.t-m.b)*(1-(v-LO)/(HI-LO||1));
 let g=axis(el,H,m,LO,HI,fmt).replaceAll('x2="W"',`x2="${W-m.r}"`);
 const step=Math.max(1,Math.ceil(rows.length/7));
 for(let i=0;i<rows.length;i+=step)g+=`<text class="lbl" x="${X(i)}" y="${H-6}" text-anchor="middle">${rows[i][xkey]}</text>`;
 lines.forEach(L=>{let d='',pen=false;rows.forEach((r,i)=>{if(r[L.key]==null){pen=false;return;}d+=(pen?'L':'M')+X(i)+' '+Y(r[L.key])+' ';pen=true;});g+=`<path d="${d}" fill="none" stroke="var(${L.color})" stroke-width="2"/>`;});
 // Crosshair-Hitzonen
 g+=`<rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent" id="hit"/>`;
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
 const svg=el.querySelector('svg');
 svg.addEventListener('mousemove',e=>{const rc=svg.getBoundingClientRect();const px=(e.clientX-rc.left)/rc.width*W;let i=Math.round((px-m.l)/((W-m.l-m.r)/(rows.length-1||1)));i=Math.max(0,Math.min(rows.length-1,i));const r=rows[i];
   let h=`<b>${r[xkey]}</b>`;lines.forEach(L=>{if(r[L.key]!=null)h+=`<br><span class="sw" style="background:var(${L.color})"></span> ${L.name}: ${de(r[L.key])}${unit||''}`;});showTT(e,h);});
 svg.addEventListener('mouseleave',hideTT);
 el.insertAdjacentHTML('afterend','');
 return `<div class="legend">${lines.map(L=>`<span><span class="sw" style="background:var(${L.color})"></span>${L.name}</span>`).join('')}</div>`;
}
function barLine(el,pts,{yl,color,fmt,unit,bar}){
 const W=el.clientWidth||520,H=200,m={t:10,r:12,b:24,l:40};
 const ys=pts.map(p=>p.y==null?0:p.y),lo=Math.min(...ys,0),hi=Math.max(...ys,1)+(Math.max(...ys,1))*0.1;
 const X=i=>m.l+(W-m.l-m.r)*(i/(pts.length-1||1)),Y=v=>m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo||1));
 let g=axis(el,H,m,lo,hi,fmt).replaceAll('x2="W"',`x2="${W-m.r}"`);
 const step=Math.max(1,Math.ceil(pts.length/7));
 if(bar){const bw=(W-m.l-m.r)/pts.length;pts.forEach((p,i)=>{if(p.y){g+=`<rect x="${m.l+(W-m.l-m.r)*(i/pts.length)+bw*0.15}" y="${Y(p.y)}" width="${bw*0.7}" height="${Math.max((H-m.t-m.b)-(Y(p.y)-m.t),0)}" rx="2" fill="var(${color})"/>`;}g+=`<rect x="${m.l+(W-m.l-m.r)*(i/pts.length)}" y="${m.t}" width="${bw}" height="${H-m.t-m.b}" fill="transparent" data-i="${i}"/>`;if(i%step===0)g+=`<text class="lbl" x="${m.l+(W-m.l-m.r)*(i/pts.length)+bw/2}" y="${H-6}" text-anchor="middle">${p.x}</text>`;});}
 else{let d='';pts.forEach((p,i)=>d+=(i?'L':'M')+X(i)+' '+Y(p.y==null?lo:p.y)+' ');g+=`<path d="${d}" fill="none" stroke="var(${color})" stroke-width="2"/>`;pts.forEach((p,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(p.y==null?lo:p.y)}" r="7" fill="transparent" data-i="${i}"/><circle cx="${X(i)}" cy="${Y(p.y==null?lo:p.y)}" r="2.3" fill="var(${color})"/>`;for(let j=0;j<pts.length;j+=step);});for(let i=0;i<pts.length;i+=step)g+=`<text class="lbl" x="${X(i)}" y="${H-6}" text-anchor="middle">${pts[i].x}</text>`;}
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
 el.querySelectorAll('[data-i]').forEach(c=>{const p=pts[+c.dataset.i];c.addEventListener('mousemove',e=>showTT(e,`<b>${p.full||p.x}</b><br>${yl}: ${de(p.y)} ${unit||''}`));c.addEventListener('mouseleave',hideTT);});
}

function scatterChart(el,groups,{line,fmtx,fmty,ux,uy}){
 const W=el.clientWidth||520,H=230,m={t:10,r:14,b:30,l:40};
 let allx=[],ally=[];groups.forEach(G=>G.pts.forEach(p=>{allx.push(p.x);ally.push(p.y);}));
 if(line){allx.push(line.x1,line.x2);ally.push(line.y1,line.y2);}
 if(!allx.length){el.innerHTML='<div class="src">noch keine Betriebspunkte – füllt sich im Betrieb</div>';return '';}
 const xlo=Math.min(...allx),xhi=Math.max(...allx),ylo=Math.min(...ally,0),yhi=Math.max(...ally);
 const XL=xlo-1,XH=xhi+1,YL=ylo,YH=yhi+(yhi-ylo)*0.1||1;
 const X=v=>m.l+(W-m.l-m.r)*((v-XL)/(XH-XL||1)),Y=v=>m.t+(H-m.t-m.b)*(1-(v-YL)/(YH-YL||1));
 let g='';for(let i=0;i<=4;i++){const v=YL+(YH-YL)*i/4,y=Y(v);g+=`<line class="gridline" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text class="lbl" x="${m.l-6}" y="${y+3}" text-anchor="end">${fmty?fmty(v):Math.round(v)}</text>`;}
 for(let i=0;i<=5;i++){const v=XL+(XH-XL)*i/5;g+=`<text class="lbl" x="${X(v)}" y="${H-8}" text-anchor="middle">${fmtx?fmtx(v):Math.round(v)}</text>`;}
 if(line)g+=`<line x1="${X(line.x1)}" y1="${Y(line.y1)}" x2="${X(line.x2)}" y2="${Y(line.y2)}" stroke="var(--t3)" stroke-width="2" stroke-dasharray="5 4"/>`;
 groups.forEach(G=>G.pts.forEach(p=>{g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="var(${G.color})" fill-opacity="0.65" data-x="${p.x}" data-y="${p.y}" data-n="${G.name}"/>`;}));
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
 el.querySelectorAll('circle[data-x]').forEach(c=>{c.addEventListener('mousemove',e=>showTT(e,`<b>${c.dataset.n}</b><br>Außen ${c.dataset.x}${ux||''} · Vorlauf ${c.dataset.y}${uy||''}`));c.addEventListener('mouseleave',hideTT);});
 const leg=groups.map(G=>`<span><span class="sw" style="background:var(${G.color})"></span>${G.name}</span>`).join('')+(line?`<span><span class="sw" style="background:var(--t3)"></span>${line.name}</span>`:'');
 return `<div class="legend">${leg}</div>`;
}
function tiles(items){return `<div class="tiles">${items.map(t=>`<div class="tile"><div class="tv"${t.c?` style="color:var(${t.c})"`:''}>${t.v}</div><div class="tl">${t.l}</div></div>`).join('')}</div>`;}
function tcol(t){if(t==null)return '#555';const c0=[57,135,229],c1=[235,104,52];const x=Math.max(0,Math.min(1,(t-22)/(75-22)));return `rgb(${c0.map((a,i)=>Math.round(a+(c1[i]-a)*x)).join(',')})`;}
function schema(L){
 const brennt=(L.geblaese||0)>500,pelB=(L.pel_geblaese||0)>500;
 const P=L.puffer||[];
 const solarOn=(L.solar_pumpe&&/ein|an|^1/i.test(''+L.solar_pumpe))||(L.kollektor!=null&&P[4]!=null&&L.kollektor>P[4]+4);
 const hkOn=(L.hk_vorlauf||0)>25,fbOn=(L.fb_vorlauf||0)>25;
 const pump=(L.kesselpumpe&&/ein|an|^1/i.test(''+L.kesselpumpe))||brennt;
 const YB='#e9b00c',YT='#f4c838',YD='#b98905',DK='#241d05',GB='#6c7074',GT='#82878c',GH='#575c60';
 const bx=392,by=66,bw=104,bh=300,sb=bh/5;let bands='';
 for(let i=0;i<5;i++)bands+=`<rect x="${bx}" y="${by+i*sb}" width="${bw}" height="${sb-1.5}" rx="3" fill="${tcol(P[i])}" opacity="0.92"/><text x="${bx+bw-8}" y="${by+i*sb+sb/2+4}" text-anchor="end" style="fill:#fff;font-size:11px">${P[i]==null?'':Math.round(P[i])+'°'}</text>`;
 const flow=(d,color,on,rev)=>`<path d="${d}" fill="none" stroke="${color}" stroke-width="7" opacity="0.22"/>${on?`<path d="${d}" fill="none" stroke="${color}" stroke-width="3.5" class="flow"${rev?' style="animation-direction:reverse"':''}/>`:''}`;
 const pumpSym=(cx,cy,on,tt)=>`<g class="comp" data-tt="${tt}"><circle cx="${cx}" cy="${cy}" r="10" fill="var(--surface2)" stroke="${on?'var(--kessel)':'var(--border)'}" stroke-width="${on?1.8:1}"/><g transform="translate(${cx},${cy})" class="${on?'pumpon':''}"><line x1="-6" y1="0" x2="6" y2="0" stroke="${on?'var(--kessel)':'var(--t3)'}" stroke-width="2"/><line x1="0" y1="-6" x2="0" y2="6" stroke="${on?'var(--kessel)':'var(--t3)'}" stroke-width="2"/></g></g>`;
 const mischSym=(cx,cy,on,tt)=>`<g class="comp" data-tt="${tt}"><circle cx="${cx}" cy="${cy}" r="10" fill="var(--surface2)" stroke="${on?'var(--mischer)':'var(--border)'}" stroke-width="${on?1.8:1}"/><path d="M${cx} ${cy-6} L${cx} ${cy} L${cx+5} ${cy+4}" fill="none" stroke="${on?'var(--mischer)':'var(--t3)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>`;
 const flame=brennt?`<g class="flame"><path d="M116 322 q-17 -30 1 -54 q12 20 19 6 q12 24 -4 48 q-7 10 -16 0 Z" fill="var(--kessel)"/><path d="M116 318 q-10 -18 1 -34 q7 12 11 3 q7 14 -3 30 q-4 5 -10 0 Z" fill="#f5a623"/><path d="M116 314 q-4 -10 1 -18 q4 6 6 2 q4 8 -1 16 q-3 3 -6 0 Z" fill="#ffd34d"/></g>`:'';
 const glut=pelB?`<circle cx="205" cy="320" r="6" fill="var(--kessel)" class="flame"/>`:'';
 const smoke=brennt?`<g class="flame" opacity="0.5"><circle cx="150" cy="150" r="7" fill="var(--t3)"/><circle cx="156" cy="138" r="5" fill="var(--t3)" opacity="0.7"/><circle cx="148" cy="128" r="4" fill="var(--t3)" opacity="0.5"/></g>`:'';
 return `<svg viewBox="0 0 760 400" class="schema">
  <rect x="145" y="150" width="10" height="86" rx="3" fill="${GB}" stroke="${GH}"/>${smoke}
  ${flow(`M150 354 L150 374 L${bx} 374 L${bx} ${by+bh}`,'#eb6834',pump)}
  ${flow(`M120 116 L120 96 L${bx} 96`,'#1baf7a',solarOn)}
  ${flow(`M${bx+bw} 150 L560 150`,'#eb6834',hkOn)}
  ${flow(`M${bx+bw} 300 L560 300`,'#3987e5',fbOn)}
  <g class="comp" data-tt="Solar-Kollektor ${de(L.kollektor)}°C${solarOn?' · Pumpe läuft':''}"><g transform="translate(96,34)"><g class="rays" opacity="${solarOn?1:0.35}">${[0,1,2,3,4,5,6,7].map(i=>`<line x1="0" y1="-16" x2="0" y2="-24" stroke="var(--solar)" stroke-width="2" transform="rotate(${i*45})"/>`).join('')}</g><circle r="11" fill="var(--solar)" opacity="${solarOn?1:0.45}"/></g><rect x="36" y="78" width="120" height="36" rx="5" fill="var(--surface2)" stroke="var(--border)"/><text x="96" y="101" text-anchor="middle">Solar ${de(L.kollektor)}°</text></g>
  <g class="comp" data-tt="Stückholzkessel ${de(L.kessel)}°C · Abgas ${de(L.abgas)}°C · ${brennt&&!pelB?'brennt':(brennt?'':'bereit')}">
   <rect x="56" y="232" width="120" height="122" rx="10" fill="${YB}" stroke="${YD}" stroke-width="1.5"/>
   <rect x="56" y="232" width="120" height="12" rx="6" fill="${YT}"/>
   <rect x="72" y="252" width="88" height="74" rx="6" fill="${YD}"/>
   <rect x="78" y="258" width="76" height="62" rx="4" fill="${DK}"/>
   ${flame}
   <circle cx="70" cy="344" r="4.5" fill="${brennt&&!pelB?'var(--o2)':'var(--t3)'}"/>
   <text x="120" y="224" text-anchor="middle" class="big">${de(L.kessel)}°</text>
   <text x="118" y="347" text-anchor="middle" style="fill:#3a2e05;font-weight:600;font-size:11px">Stückholz</text>
  </g>
  <g class="comp" data-tt="Pelletmodul · ${pelB?'in Betrieb':'bereit'} · Vorrat ${de(L.lager_vorrat)} kg">
   <path d="M182 250 L190 228 L220 228 L228 250 Z" fill="${GH}" stroke="${GH}"/>
   <rect x="176" y="250" width="58" height="104" rx="8" fill="${GB}" stroke="${pelB?'var(--kessel)':GH}" stroke-width="${pelB?2:1}"/>
   <rect x="176" y="250" width="58" height="10" rx="5" fill="${GT}"/>
   <rect x="188" y="300" width="34" height="34" rx="5" fill="${GH}"/>
   ${glut}
   <circle cx="186" cy="344" r="4" fill="${pelB?'var(--o2)':'var(--t3)'}"/>
   <text x="205" y="347" text-anchor="middle" style="fill:#e9e8e3;font-size:10px">Pellet</text>
   <text x="205" y="222" text-anchor="middle" style="font-size:9.5px">Behälter</text>
  </g>
  <g class="comp" data-tt="Förderschnecke${pelB?' · fördert Pellets':''}"><path d="M150 304 L190 304" fill="none" stroke="${pelB?'var(--pellet)':'var(--t3)'}" stroke-width="5" opacity="0.3"/>${pelB?`<path d="M150 304 L190 304" fill="none" stroke="var(--pellet)" stroke-width="3" class="flow"/>`:''}</g>
  ${pumpSym(271,374,pump,`Kesselpumpe · ${pump?'läuft':'aus'}`)}
